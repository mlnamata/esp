; PlatformIO konfigurace pro DroneDocker ESP32 firmware
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Závislosti knihoven
lib_deps =
    esphome/ESPAsyncWebServer-esphome
    bblanchon/ArduinoJson @ ^6

; Kompilační flagy – potlačení varování z třetích stran
build_flags =
    -DCORE_DEBUG_LEVEL=0
